{{- if and .Values.mediamtx.enabled .Values.mediamtx.service.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-mediamtx" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: mediamtx
  {{- if or .Values.mediamtx.service.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.mediamtx.service.annotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.mediamtx.service.type }}
  {{- if and (eq .Values.mediamtx.service.type "LoadBalancer") .Values.mediamtx.service.loadBalancerIP }}
  loadBalancerIP: {{ .Values.mediamtx.service.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.mediamtx.service.type "LoadBalancer") .Values.mediamtx.service.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml .Values.mediamtx.service.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  ports:
    - name: rtsp
      port: {{ .Values.mediamtx.service.ports.rtsp }}
      targetPort: mtx-rtsp
      protocol: TCP
    - name: rtmp
      port: {{ .Values.mediamtx.service.ports.rtmp }}
      targetPort: mtx-rtmp
      protocol: TCP
    - name: rtmps
      port: {{ .Values.mediamtx.service.ports.rtmps }}
      targetPort: mtx-rtmps
      protocol: TCP
    - name: hls
      port: {{ .Values.mediamtx.service.ports.hls }}
      targetPort: mtx-hls
      protocol: TCP
    - name: webrtc
      port: {{ .Values.mediamtx.service.ports.webrtc }}
      targetPort: mtx-webrtc
      protocol: TCP
    - name: webrtc-ice
      port: {{ .Values.mediamtx.service.ports.webrtcIce }}
      targetPort: mtx-webrtc-ice
      protocol: UDP
    - name: srt
      port: {{ .Values.mediamtx.service.ports.srt }}
      targetPort: mtx-srt
      protocol: UDP
    {{- with .Values.mediamtx.service.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}

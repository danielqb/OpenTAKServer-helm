{{- if .Values.streamingService.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ printf "%s-streaming" (include "opentakserver.server.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: server-streaming
  {{- if or .Values.streamingService.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.streamingService.annotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  type: {{ .Values.streamingService.type }}
  {{- if and (eq .Values.streamingService.type "LoadBalancer") .Values.streamingService.loadBalancerIP }}
  loadBalancerIP: {{ .Values.streamingService.loadBalancerIP }}
  {{- end }}
  {{- if and (eq .Values.streamingService.type "LoadBalancer") .Values.streamingService.loadBalancerSourceRanges }}
  loadBalancerSourceRanges: {{- toYaml .Values.streamingService.loadBalancerSourceRanges | nindent 4 }}
  {{- end }}
  {{- if and .Values.streamingService.externalTrafficPolicy (ne .Values.streamingService.type "ClusterIP") }}
  externalTrafficPolicy: {{ .Values.streamingService.externalTrafficPolicy }}
  {{- end }}
  ports:
    {{- if and .Values.streamingService.tcpCotEnabled .Values.server.eudHandler.enabled }}
    - name: cot-tcp
      port: {{ .Values.streamingService.tcpCotPort }}
      targetPort: cot-tcp
      protocol: TCP
      {{- if and (eq .Values.streamingService.type "NodePort") .Values.streamingService.tcpCotNodePort }}
      nodePort: {{ .Values.streamingService.tcpCotNodePort }}
      {{- end }}
    {{- end }}
    {{- if and .Values.streamingService.sslCotEnabled .Values.server.eudHandlerSsl.enabled }}
    - name: cot-ssl
      port: {{ .Values.streamingService.sslCotPort }}
      targetPort: cot-ssl
      protocol: TCP
      {{- if and (eq .Values.streamingService.type "NodePort") .Values.streamingService.sslCotNodePort }}
      nodePort: {{ .Values.streamingService.sslCotNodePort }}
      {{- end }}
    {{- end }}
    {{- if .Values.nginxProxy.enabled }}
    - name: tak-marti
      port: {{ .Values.nginxProxy.service.martiPort }}
      targetPort: tak-marti
      protocol: TCP
    - name: tak-enroll
      port: {{ .Values.nginxProxy.service.enrollmentPort }}
      targetPort: tak-enroll
      protocol: TCP
    - name: tak-mqtts
      port: {{ .Values.nginxProxy.service.mqttsPort }}
      targetPort: tak-mqtts
      protocol: TCP
    {{- end }}
    {{- with .Values.streamingService.extraPorts }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  selector: {{- include "common.labels.matchLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
{{- end }}

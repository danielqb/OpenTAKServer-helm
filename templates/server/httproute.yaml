{{- if .Values.gateway.enabled }}
{{- $fullName := include "common.names.fullname" . -}}
{{- $svcServer := include "opentakserver.server.fullname" . -}}
{{- $svcWebui := include "opentakserver.webui.fullname" . -}}
{{- $host := include "opentakserver.gateway.hostname" . -}}
{{- $apiPort := .Values.service.ports.http -}}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $fullName }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
  {{- if or .Values.gateway.annotations .Values.commonAnnotations }}
  annotations:
    {{- with .Values.gateway.annotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
    {{- with .Values.commonAnnotations }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
  {{- end }}
spec:
  parentRefs:
    {{- range .Values.gateway.parentRefs }}
    - name: {{ required "gateway.parentRefs[].name is required when gateway.enabled=true" .name }}
      {{- with .namespace }}
      namespace: {{ . }}
      {{- end }}
      {{- with .sectionName }}
      sectionName: {{ . }}
      {{- end }}
    {{- end }}
  hostnames:
    - {{ $host | quote }}
  rules:
    {{- range .Values.gateway.apiPaths }}
    - matches:
        - path:
            type: PathPrefix
            value: {{ . }}
      {{- with $.Values.gateway.filters }}
      filters: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      backendRefs:
        - name: {{ $svcServer }}
          port: {{ $apiPort }}
    {{- end }}
    {{- if and .Values.mediamtx.enabled .Values.mediamtx.service.enabled }}
    - matches:
        - path:
            type: PathPrefix
            value: /hls
      backendRefs:
        - name: {{ printf "%s-mediamtx" $fullName }}
          port: {{ .Values.mediamtx.service.ports.hls }}
    - matches:
        - path:
            type: PathPrefix
            value: /webrtc
      backendRefs:
        - name: {{ printf "%s-mediamtx" $fullName }}
          port: {{ .Values.mediamtx.service.ports.webrtc }}
    {{- end }}
    - matches:
        - path:
            type: {{ .Values.gateway.pathType }}
            value: {{ .Values.gateway.path }}
      {{- with .Values.gateway.filters }}
      filters: {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 8 }}
      {{- end }}
      backendRefs:
        {{- if .Values.webui.enabled }}
        - name: {{ $svcWebui }}
          port: {{ .Values.webui.service.port }}
        {{- else }}
        - name: {{ $svcServer }}
          port: {{ $apiPort }}
        {{- end }}
    {{- with .Values.gateway.extraRules }}
    {{- include "common.tplvalues.render" (dict "value" . "context" $) | nindent 4 }}
    {{- end }}
{{- end }}

apiVersion: v1
kind: Pod
metadata:
  name: {{ printf "%s-test-connection" (include "common.names.fullname" .) }}
  namespace: {{ include "common.names.namespace" . | quote }}
  labels: {{- include "common.labels.standard" . | nindent 4 }}
    app.kubernetes.io/component: test
  annotations:
    helm.sh/hook: test
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  restartPolicy: Never
  containers:
    - name: test
      image: {{ include "opentakserver.webui.image" . }}
      command: ["/bin/sh", "-c"]
      args:
        - >
          wget -q -O- http://{{ include "opentakserver.server.fullname" . }}:{{ .Values.service.ports.http }}/api/health
          && echo OK

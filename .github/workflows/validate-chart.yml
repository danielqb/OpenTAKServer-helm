name: Validate Helm chart

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Helm (${{ matrix.scenario }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - scenario: default-tls
            args: --set-string opentakserver.fqdn=example.invalid --set-string ingress.tlsSecret=example-tls
          - scenario: nginx-proxy
            args: --set-string opentakserver.fqdn=example.invalid --set-string ingress.tlsSecret=example-tls --set nginxProxy.enabled=true
          - scenario: external-services
            args: >-
              --set-string opentakserver.fqdn=example.invalid
              --set-string ingress.tlsSecret=example-tls
              --set postgresql.enabled=false
              --set-string externalDatabase.host=postgis.example.invalid
              --set-string externalDatabase.password=example
              --set rabbitmq.enabled=false
              --set-string externalRabbitmq.host=rabbitmq.example.invalid
              --set-string externalRabbitmq.password=example
          - scenario: gateway
            args: >-
              --set-string opentakserver.fqdn=example.invalid
              --set ingress.enabled=false
              --set gateway.enabled=true
              --set-string gateway.parentRefs[0].name=example-gateway
              --set-string gateway.filters[0].type=RequestHeaderModifier
              --set-string gateway.filters[0].requestHeaderModifier.set[0].name=X-Forwarded-Host
              --set-string gateway.filters[0].requestHeaderModifier.set[0].value=tak.public.invalid
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Lint chart strictly
        run: helm lint . --strict ${{ matrix.args }}

      - name: Render manifests
        run: helm template opentakserver . ${{ matrix.args }} --output-dir ./opentakserver-rendered

      - name: Validate rendered manifests against Kubernetes schemas
        uses: docker://ghcr.io/yannh/kubeconform:v0.6.7
        with:
          args: -strict -summary -ignore-missing-schemas -kubernetes-version 1.30.0 ./opentakserver-rendered

      - name: Install Helm unit-test plugin
        if: matrix.scenario == 'default-tls'
        uses: d3adb5/helm-unittest-action@v2.5.1

      - name: Run Helm unit tests
        if: matrix.scenario == 'default-tls'
        run: helm unittest .

      - name: Verify values.schema.json rejects invalid values
        if: matrix.scenario == 'default-tls'
        shell: bash
        run: |
          set -euo pipefail
          expect_reject() {
            local desc="$1"; shift
            if helm template opentakserver . \
              --set-string opentakserver.fqdn=example.invalid \
              --set-string ingress.tlsSecret=example-tls \
              "$@" >/dev/null 2>/tmp/schema-reject.err; then
              echo "Expected schema validation to reject: $desc" >&2
              exit 1
            fi
            echo "Rejected as expected: $desc"
          }
          expect_reject "unknown top-level key" --set ingres.enabled=false
          expect_reject "malformed persistence.size" --set-string persistence.size=notasize
          expect_reject "invalid image pullPolicy" --set-string server.image.pullPolicy=Sometimes

  security:
    name: Security scan (rendered manifests)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Helm
        uses: azure/setup-helm@v4

      - name: Render manifests
        run: |
          helm template opentakserver . \
            --set-string opentakserver.fqdn=example.invalid \
            --set-string ingress.tlsSecret=example-tls \
            --output-dir ./opentakserver-rendered

      # This chart references upstream images only (brian7704/*, mediamtx,
      # nginx-unprivileged, postgis, rabbitmq) rather than building its own,
      # so there's no image to scan here - only the manifests this chart
      # itself generates (privileged containers, missing resource limits,
      # host namespaces, etc.).
      - name: Scan manifests with Trivy (config/IaC)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: config
          scan-ref: ./opentakserver-rendered
          format: table
          severity: CRITICAL,HIGH
          exit-code: '1'

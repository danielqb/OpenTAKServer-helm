suite: basic chart rendering
templates:
  - templates/server/service.yaml
  - templates/server/ingress.yaml
  - templates/server/httproute.yaml
  - templates/tests/test-connection.yaml
tests:
  - it: renders the API service as ClusterIP
    template: templates/server/service.yaml
    set:
      opentakserver.fqdn: example.invalid
      ingress.tlsSecret: example-tls
    asserts:
      - equal:
          path: spec.type
          value: ClusterIP
      - equal:
          path: spec.ports[0].port
          value: 8081

  - it: renders the configured ingress hostname and TLS secret
    template: templates/server/ingress.yaml
    set:
      opentakserver.fqdn: tak.example.invalid
      ingress.tlsSecret: tak-tls
    asserts:
      - equal:
          path: spec.rules[0].host
          value: tak.example.invalid
      - equal:
          path: spec.tls[0].secretName
          value: tak-tls

  - it: renders a Helm test pod against the API service
    template: templates/tests/test-connection.yaml
    set:
      opentakserver.fqdn: example.invalid
      ingress.tlsSecret: example-tls
    asserts:
      - matchSnapshot:
          path: spec

  - it: applies gateway.filters to the API and web UI rules but not MediaMTX
    template: templates/server/httproute.yaml
    set:
      opentakserver.fqdn: example.invalid
      ingress.enabled: false
      gateway.enabled: true
      gateway.parentRefs[0].name: example-gateway
      gateway.filters:
        - type: RequestHeaderModifier
          requestHeaderModifier:
            set:
              - name: X-Forwarded-Host
                value: tak.public.invalid
    asserts:
      # /api rule
      - equal:
          path: spec.rules[0].filters[0].type
          value: RequestHeaderModifier
      - equal:
          path: spec.rules[0].filters[0].requestHeaderModifier.set[0].value
          value: tak.public.invalid
      # /hls rule (MediaMTX) has no filters
      - notExists:
          path: spec.rules[3].filters
      # base web UI rule
      - equal:
          path: spec.rules[5].filters[0].type
          value: RequestHeaderModifier

  - it: omits filters from every rule when gateway.filters is unset
    template: templates/server/httproute.yaml
    set:
      opentakserver.fqdn: example.invalid
      ingress.enabled: false
      gateway.enabled: true
      gateway.parentRefs[0].name: example-gateway
    asserts:
      - notExists:
          path: spec.rules[0].filters
      - notExists:
          path: spec.rules[5].filters
